# COSEnu laptop configuration
#
# Edit values after the = sign, then run:  ./cosenu.sh run
# These reproduce the active settings from parameter_scan.sh, with the
# remaining numerical/output settings taken from cosenu_configs.yaml.
#
# Unit convention (natural units with c=1):
#   - distance z and evolution time t are measured in MU^-1
#   - frequencies, potentials, and damping rates are measured in MU
#   - a spatial potential slope is measured in MU^2
#   - velocities and distribution parameters are dimensionless
#   - MIXING_ANGLE is the exception: it is entered in degrees

# Numerical method: fd (finite difference) or fv (finite volume)
SCHEME=fd                 # fv selects the finite-volume method

# Boundary: periodic or open
BOUNDARY=periodic         # open selects open boundary conditions

# Physics/numerics switches: true or false
VACUUM_OSCILLATIONS=true      # false disables vacuum oscillations
MATTER_OSCILLATIONS=false     # true enables matter oscillations
COLLECTIVE_OSCILLATIONS=true  # false disables collective oscillations
ADVECTION=true                # false disables advection

# Energy treatment
# false runs the original monoenergetic solver exactly as before. true evolves
# ENERGY_BINS neutrino plus ENERGY_BINS antineutrino modes and enables the
# additional spectral plots. The ordinary plots remain energy integrated.
MULTIENERGY=false
ENERGY_GRID=energy            # energy: uniform MeV grid; omega: article-validation grid
ENERGY_BINS=12                # bins per sector (24 frequency modes total)
ENERGY_MIN=2.0                # MeV; used by ENERGY_GRID=energy
ENERGY_MAX=60.0               # MeV; used by ENERGY_GRID=energy
OMEGA_GRID_MIN=0.0            # |omega|/MU lower edge; used by ENERGY_GRID=omega
OMEGA_GRID_MAX=0.25           # |omega|/MU upper edge; used by ENERGY_GRID=omega
REFERENCE_ENERGY=10.0         # MeV; OMEGA is defined at this energy
SPECTRAL_ALPHA=2.3            # pinching alpha; ~2.30 moment-matches zero-chemical-potential FD
MEAN_ENERGY_NUE=9.6           # MeV
MEAN_ENERGY_ANTINUE=11.8      # MeV
MEAN_ENERGY_NUX=16.0          # MeV; shared by nu_x and antinu_x
LUMINOSITY_NUE=44.0           # any common luminosity unit
LUMINOSITY_ANTINUE=45.0       # same unit as LUMINOSITY_NUE
LUMINOSITY_NUX=20.0           # same unit; one heavy-lepton species

# Spatial and angular grids
Z_MIN=-100                 # distance in MU^-1; use -10 with Z_MAX=10 for a shorter domain
Z_MAX=100                  # distance in MU^-1; use 10 with Z_MIN=-10 for a shorter domain
NZ=500                    # use 100 for a quick, lower-resolution test. Published high resolution 1000.
V_MIN=-1.0                # dimensionless v_z (c=1); lower velocity edge
V_MAX=1.0                 # dimensionless v_z (c=1); upper velocity edge
NVZ=256                   # use 32 for a quick, lower-resolution test. Published high resolution 512.
CFL=0.4                   # dimensionless; reduce for a smaller time step

# Power-spectrum sampling; k is an angular wavenumber measured in MU
K_MAX=2.0                # calculate power from -K_MAX to +K_MAX
K_BINS=1000               # number of k samples; use 500 for a quicker analysis
# The resolvable limit is pi/dz. With the grid above it is 15.7 MU;
# use NZ=1280 or higher on this domain to resolve K_MAX=40 without aliasing.

# Evolution and physics parameters
# For the physical axes, OMEGA is omega/MU at REFERENCE_ENERGY.
# At REFERENCE_ENERGY=10 MeV, omega=0.63 km^-1 gives MU=0.63/OMEGA km^-1.
# Upper axes use meters for distance and microseconds for time
# (exactly c=299.792458 m/us).
END_TIME=500              # evolution time in MU^-1; use 10 for a quick test. Published longer run 1000.
PERTURBATION_SIZE=1e-2    # dimensionless initial flavor-perturbation amplitude
MASS_ORDERING=1.0         # dimensionless: +1 normal, -1 inverted ordering
OMEGA=1.0e-2              # dimensionless omega/MU; changing it rescales the physical plot axes
MIXING_ANGLE=0.00057295779513082321          # vacuum mixing angle in degrees; e.g. 6.8. Also, 1e-5 rad = 0.00057295779513082321 degrees
MU=1.0                    # self-interaction strength (sqrt(2)*GF*n_nu) in reference-MU units (normally 1.0)

# Angular distributions and initial perturbations
ALPHA=0.85                # dimensionless antineutrino/neutrino normalization. Other published values 0.925, 1.0, 1.1
NEUTRINO_WIDTH=0.6        # dimensionless width in v_z
ANTINEUTRINO_WIDTH=0.6    # dimensionless width in v_z
ANGULAR_PROFILE=gaussian  # gaussian for the normal continuous angular distribution
RANDOM_SEEDS=false        # true uses randomized Fourier-mode seeds
SEED_WIDTH=3.0            # Gaussian seed width in MU^-1

# Matter profile: Hm(z) = MATTER_OFFSET + MATTER_SLOPE * (z - Z_MIN)
MATTER_SLOPE=0.0          # in MU^2; e.g. 5e-3 gives a linearly increasing term
MATTER_OFFSET=0.0         # matter potential in MU; e.g. 0.1 at Z_MIN
# For a large spatially varying matter potential, this applies its diagonal
# phase rotation analytically and avoids accumulated RK4 norm damping.
EXACT_MATTER_ROTATION=false

# Off-diagonal collision terms for both fd and fv (zero switches them off)
# C = DAMPING_RATE and Cbar = ANTINEUTRINO_COLLISION_RATIO * C.
# For a later CFI experiment without vacuum oscillations, set OMEGA=0 and use
# unequal rates, for example DAMPING_RATE=1e-2 and the ratio below equal to 0.15.
DAMPING_RATE=0.0                  # neutrino damping rate C in MU; e.g. 1e-2
ANTINEUTRINO_COLLISION_RATIO=0.0  # dimensionless Cbar/C; e.g. 0.15

# Number of analysis records and full density snapshots. Snapshots use compact
# rho_*.npy arrays; at NZ=500 and NVZ=256 each one is about 9.8 MiB.
ANALYSES=200              # use 10 for fewer diagnostic records
SNAPSHOTS=50              # 51 files including t=0: about 498 MiB; use 5 for about 59 MiB
T_STEADY=300              # in MU^-1; angular distributions are time-averaged from here to the end
# More snapshots give a better-resolved time average but create larger output.
# Allow roughly 0.55 GiB for this complete run, excluding the Python environment.
# For a short test ending before T_STEADY, the final snapshot is used.

# Generate the standard analysis plots after the simulation: yes or no
# Python, NumPy, and Matplotlib are installed automatically when needed.
PLOTS=yes                 # no skips Python setup and plot generation

# Optional linear stability analysis after COSEnu: true or false
# It reuses all COSEnu physics and angular-distribution parameters.
LINEAR_STABILITY_ANALYSIS=true  # true creates the LSA plots after the simulation
LSA_NVZ=200               # independent number of angular bins used only by the LSA
LSA_NUM=50                # number of LSA k samples (called "num" in the legacy code)
LSA_K_MIN=-0.5            # lower LSA wavenumber in MU (the active legacy setting)
LSA_K_MAX=0.5             # upper LSA wavenumber in MU; keep within COSEnu's K_MAX

# The launcher automatically selects an OpenMP compiler when one is available.
# auto uses up to 12 CPU threads; a number such as 4 sets a fixed limit.
# This setup took about 14 minutes on the development M4 Pro; laptops vary.
THREADS=auto              # use a number such as 4 to set a fixed limit
