# COSEnu high-resolution fast-flavor template
#
# Run with:  ./cosenu.sh run conf_templates/fast.conf
# This is the verified OMEGA=0 case with a deep ELN angular crossing.
#
# Unit convention (natural units with c=1):
#   - distance z and evolution time t are measured in MU^-1
#   - frequencies, potentials, and damping rates are measured in MU
#   - velocities and distribution parameters are dimensionless
#   - MIXING_ANGLE is entered in degrees

# Numerical method and boundary
SCHEME=fd
BOUNDARY=periodic

# Physics/numerics switches
VACUUM_OSCILLATIONS=false
MATTER_OSCILLATIONS=false
COLLECTIVE_OSCILLATIONS=true
ADVECTION=true

MULTIENERGY=false
ENERGY_GRID=energy
ENERGY_BINS=12
ENERGY_MIN=2.0
ENERGY_MAX=60.0
OMEGA_GRID_MIN=0.0
OMEGA_GRID_MAX=0.25
REFERENCE_ENERGY=10.0
SPECTRAL_ALPHA=2.3
MEAN_ENERGY_NUE=9.6
MEAN_ENERGY_ANTINUE=11.8
MEAN_ENERGY_NUX=16.0
LUMINOSITY_NUE=44.0
LUMINOSITY_ANTINUE=45.0
LUMINOSITY_NUX=20.0

# High-resolution spatial and angular grids
Z_MIN=-200                # distance in MU^-1; L=200 resolves the unstable k band finely
Z_MAX=200                 # distance in MU^-1
NZ=500                    # high-resolution laptop grid; use 100 only for a quick test
V_MIN=-1.0                # dimensionless v_z lower edge
V_MAX=1.0                 # dimensionless v_z upper edge
NVZ=256                   # high-resolution angular grid; use 32 only for a quick test
CFL=0.4

# Power spectrum; k is measured in MU
K_MAX=2.0
K_BINS=1000

# Fast evolution: OMEGA=0 and a small seed keep the measured interval linear
END_TIME=200               # final time
PERTURBATION_SIZE=1e-3 #1e-7
MASS_ORDERING=1.0         # irrelevant when vacuum oscillations are disabled
OMEGA=0.0                 # fast limit; no physical-unit conversion can be inferred from omega
MIXING_ANGLE=0.0          # irrelevant when vacuum oscillations are disabled
MU=1.0

# Deep ELN crossing: rho_ee-rhobar_ee crosses near v_z=0.585
ALPHA=0.9
NEUTRINO_WIDTH=0.6
ANTINEUTRINO_WIDTH=0.4
ANGULAR_PROFILE=gaussian
RANDOM_SEEDS=false
SEED_WIDTH=3.0            # Gaussian seed width in MU^-1

# Matter and collisions are disabled for the verified fast case
MATTER_SLOPE=0.0
MATTER_OFFSET=0.0
DAMPING_RATE=0.0
ANTINEUTRINO_COLLISION_RATIO=0.0

# High-resolution diagnostics. Compact rho_*.npy snapshots are about 9.8 MiB
# each at this grid; the requested cadence produces 52 files (about 508 MiB).
ANALYSES=200
SNAPSHOTS=50              # allow roughly 0.56 GiB for the complete run
T_STEADY=300
PLOTS=yes

# L=200 gives Delta k=2*pi/L=0.0314159 MU. These 63 samples are
# box-supported modes n=-31,...,+31 and include the dominant n=-11 mode.
LINEAR_STABILITY_ANALYSIS=true
LSA_NVZ=200
LSA_NUM=63
LSA_K_MIN=-0.9738937226128359
LSA_K_MAX=0.9738937226128359

THREADS=auto               # automatically uses up to 12 CPU threads
