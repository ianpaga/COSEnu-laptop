# COSEnu laptop-friendly two-flavor vacuum-oscillation template
#
# Run with:  ./cosenu.sh run conf_templates/vacuum.conf
# The survival plot automatically compares COSEnu with
# Pee(t) = 1 - sin^2(2 theta) sin^2(omega t / 2).
#
# Unit convention (natural units with c=1):
#   - distance z and evolution time t are measured in MU^-1
#   - frequencies are measured in MU
#   - velocities and distribution parameters are dimensionless
#   - MIXING_ANGLE is entered in degrees

# Numerical method and boundary
SCHEME=fd
BOUNDARY=periodic

# Vacuum oscillations are the only active flavor-changing physics
VACUUM_OSCILLATIONS=true
MATTER_OSCILLATIONS=false
COLLECTIVE_OSCILLATIONS=false
ADVECTION=false

MULTIENERGY=false            # keep the analytic single-frequency comparison exact
ENERGY_GRID=energy
ENERGY_BINS=12
ENERGY_MIN=2.0
ENERGY_MAX=60.0
OMEGA_GRID_MIN=0.0
OMEGA_GRID_MAX=0.25
REFERENCE_ENERGY=10.0
SPECTRAL_ALPHA=2.3
MEAN_ENERGY_NUE=9.6
MEAN_ENERGY_ANTINUE=11.8
MEAN_ENERGY_NUX=16.0
LUMINOSITY_NUE=44.0
LUMINOSITY_ANTINUE=45.0
LUMINOSITY_NUX=20.0

# This test is exactly homogeneous and has no advection, so extra z or v_z bins
# only repeat the same ODE.  The compact grid keeps the long vacuum timescale
# quick to run on a laptop.  The box spacing gives dt=CFL*dz=1000 MU^-1 and
# omega*dt=0.01, which resolves each oscillation period with about 628 steps.
Z_MIN=-20000
Z_MAX=20000
NZ=16
V_MIN=-1.0
V_MAX=1.0
NVZ=16
CFL=0.4

# Retained for common output compatibility; no power spectrum is calculated
# when collective oscillations are disabled.  Keep this unused value below the
# compact grid's Nyquist limit so the launcher does not show an irrelevant warning.
K_MAX=1.0e-3
K_BINS=100

# omega/MU=1e-5 gives period 2*pi/omega = 628318.53 MU^-1.
# END_TIME spans the same omega*t interval as the earlier omega=0.1,
# END_TIME=200 test: about 3.18 complete oscillations.
# theta=33 degrees gives a large, easily visible oscillation amplitude.
END_TIME=2.0e6
PERTURBATION_SIZE=0.0     # required for an initially pure electron-flavor state
MASS_ORDERING=1.0         # changing its sign does not change the vacuum probability
OMEGA=1.0e-5              # dimensionless omega/MU
MIXING_ANGLE=33.0         # two-flavor vacuum mixing angle in degrees
MU=1.0                    # ignored because collective oscillations are disabled

# These distributions cancel out of the normalized vacuum probability.
ALPHA=0.85
NEUTRINO_WIDTH=0.6
ANTINEUTRINO_WIDTH=0.6
ANGULAR_PROFILE=gaussian
RANDOM_SEEDS=false
SEED_WIDTH=3.0

# Matter and collisions are disabled
MATTER_SLOPE=0.0
MATTER_OFFSET=0.0
DAMPING_RATE=0.0
ANTINEUTRINO_COLLISION_RATIO=0.0

# Dense probability sampling resolves the analytic oscillation curve. The tiny
# grid makes each compact rho_*.npy snapshot about 20 KiB, so output is modest.
ANALYSES=400
SNAPSHOTS=10              # 10 files including t=0 use only about 0.20 MiB
T_STEADY=1.5e6
PLOTS=yes

# Linear stability analysis is not applicable to this single-particle check.
LINEAR_STABILITY_ANALYSIS=false
LSA_NVZ=200
LSA_NUM=20
LSA_K_MIN=-0.5
LSA_K_MAX=0.5

THREADS=auto               # automatically uses up to 12 CPU threads
