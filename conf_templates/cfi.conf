# COSEnu high-resolution collisional-flavor-instability template
#
# Run with:  ./cosenu.sh run conf_templates/cfi.conf
# This is the verified OMEGA=0, no-angular-crossing case with unequal
# neutrino and antineutrino off-diagonal damping rates.
#
# Unit convention (natural units with c=1):
#   - distance z and evolution time t are measured in MU^-1
#   - frequencies, potentials, and damping rates are measured in MU
#   - velocities and distribution parameters are dimensionless
#   - MIXING_ANGLE is entered in degrees

# The CFI agreement test used the finite-volume implementation.
SCHEME=fv
BOUNDARY=periodic

# Physics/numerics switches
VACUUM_OSCILLATIONS=false
MATTER_OSCILLATIONS=false
COLLECTIVE_OSCILLATIONS=true
ADVECTION=true

MULTIENERGY=false
ENERGY_GRID=energy
ENERGY_BINS=12
ENERGY_MIN=2.0
ENERGY_MAX=60.0
OMEGA_GRID_MIN=0.0
OMEGA_GRID_MAX=0.25
REFERENCE_ENERGY=10.0
SPECTRAL_ALPHA=2.3
MEAN_ENERGY_NUE=9.6
MEAN_ENERGY_ANTINUE=11.8
MEAN_ENERGY_NUX=16.0
LUMINOSITY_NUE=44.0
LUMINOSITY_ANTINUE=45.0
LUMINOSITY_NUX=20.0

# High-resolution spatial and angular grids
Z_MIN=-100                # distance in MU^-1; L=200 resolves the unstable k band finely
Z_MAX=100                 # distance in MU^-1
NZ=500                    # high-resolution laptop grid; use 100 only for a quick test
V_MIN=-1.0                # dimensionless v_z lower edge
V_MAX=1.0                 # dimensionless v_z upper edge
NVZ=256                   # high-resolution angular grid; use 32 only for a quick test
CFL=0.4

# Power spectrum; k is measured in MU
K_MAX=2.0
K_BINS=1000

# CFI evolution: OMEGA=0 and a small seed keep the measured interval linear
END_TIME=300
PERTURBATION_SIZE=1e-6
MASS_ORDERING=1.0         # irrelevant when vacuum oscillations are disabled
OMEGA=0.0                 # no physical-unit conversion can be inferred from omega
MIXING_ANGLE=0.0          # irrelevant when vacuum oscillations are disabled
MU=1.0

# Equal widths give no ELN angular crossing for ALPHA=0.85
ALPHA=0.85
NEUTRINO_WIDTH=0.6
ANTINEUTRINO_WIDTH=0.6
ANGULAR_PROFILE=gaussian
RANDOM_SEEDS=false
SEED_WIDTH=5.0

# Matter is disabled; unequal collision rates drive the CFI
MATTER_SLOPE=0.0
MATTER_OFFSET=0.0
DAMPING_RATE=1e-2                  # neutrino damping rate C in MU
ANTINEUTRINO_COLLISION_RATIO=0.15  # Cbar/C, so Cbar=1.5e-3 MU

# High-resolution diagnostics. Compact rho_*.npy snapshots are about 9.8 MiB
# each at this grid; 51 files including t=0 use about 498 MiB.
ANALYSES=200
SNAPSHOTS=50              # allow roughly 0.55 GiB for the complete run
T_STEADY=250
PLOTS=yes

# L=200 gives Delta k=2*pi/L=0.0314159 MU. These 63 samples are
# box-supported modes n=-31,...,+31 and include k=0.0942478 MU.
LINEAR_STABILITY_ANALYSIS=true
LSA_NVZ=200
LSA_NUM=63
LSA_K_MIN=-0.9738937226128359
LSA_K_MAX=0.9738937226128359

THREADS=auto               # automatically uses up to 12 CPU threads
