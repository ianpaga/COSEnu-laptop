# Continuous-angle cross-check of Soumya's slow, inhomogeneous-matter setup
#
# Run with:
#   ./cosenu.sh run conf_templates/inhom_slow_soumya_continuous.conf
#
# Both species use the same normalized, forward-peaked Gaussian angular shape.
# Its integrated occupations are 1 and ALPHA=0.85.  This is the natural
# continuous COSEnu convention, but it is not a literal density-matched limit
# of the companion file, whose quoted Soumya occupations apply to each of two
# discrete beams.  It is therefore an independent angular-continuum check.
# The ELN remains positive at every v_z, so there is no fast angular crossing.
# COSEnu notation is used throughout the output: rho_ee, |rho_ex|, survival
# probability, and mean coherence.
#
# Unit convention (natural units with c=1):
#   - z, t, and SEED_WIDTH are in MU^-1
#   - OMEGA, lambda, and damping rates are in MU
#   - MATTER_SLOPE=d lambda/dz is in MU^2
#   - MIXING_ANGLE is entered in degrees

SCHEME=fd
BOUNDARY=periodic

VACUUM_OSCILLATIONS=true
MATTER_OSCILLATIONS=true
COLLECTIVE_OSCILLATIONS=true
ADVECTION=true

MULTIENERGY=false
ENERGY_GRID=energy
ENERGY_BINS=12
ENERGY_MIN=2.0
ENERGY_MAX=60.0
OMEGA_GRID_MIN=0.0
OMEGA_GRID_MAX=0.25
REFERENCE_ENERGY=10.0
SPECTRAL_ALPHA=2.3
MEAN_ENERGY_NUE=9.6
MEAN_ENERGY_ANTINUE=11.8
MEAN_ENERGY_NUX=16.0
LUMINOSITY_NUE=44.0
LUMINOSITY_ANTINUE=45.0
LUMINOSITY_NUX=20.0

# High spatial/angular resolution for the independent continuous-mode check.
# For the validated quick exploratory grid, use NZ=1000, NVZ=64, CFL=0.2,
# and SNAPSHOTS=5.  It is suitable for trends, not precision growth-rate fits.
Z_MIN=-500
Z_MAX=500
NZ=2500
V_MIN=-1.0
V_MAX=1.0
NVZ=256
CFL=0.2

K_MAX=1.0
K_BINS=1000

END_TIME=500
PERTURBATION_SIZE=0.006
MASS_ORDERING=-1.0       # inverted ordering
OMEGA=0.006              # omega/MU
MIXING_ANGLE=0.00057295779513082321  # 1e-5 radians
MU=1.0

ALPHA=0.85
NEUTRINO_WIDTH=0.6
ANTINEUTRINO_WIDTH=0.6
ANGULAR_PROFILE=gaussian
RANDOM_SEEDS=false
# Current interpretation: the quoted width ~50 is the exponent denominator,
# so exp(-z^2/50) corresponds to sigma=5 in exp[-z^2/(2 sigma^2)].
SEED_WIDTH=5.0

# lambda(z)=1+m(z+500), using the legacy lambda0=1 offset and the same
# default slope as the two-beam file.  EXACT_MATTER_ROTATION=true evaluates
# the stiff diagonal phase analytically.  If it is disabled, these conservative
# CFL values for the NZ=2500 grid keep max_z(lambda)*dt below about 0.5:
#   m <= 0.001: CFL=0.4        m=0.005: CFL=0.2
#   m = 0.01  : CFL=0.1        m=0.02 : CFL=0.05
#   m = 0.04  : CFL=0.025      m=0.06 : CFL=0.016
#   m = 0.08  : CFL=0.012      m=0.15 : CFL=0.0065
# The continuous grid has twice the spatial step of the two-beam grid, so it
# needs half its CFL at the same m.  A smaller CFL increases runtime but
# prevents unresolved matter precession from looking like a physical effect.
# The spatial criterion is separate: |k_eff|~m*t.  At t=500, about 12 cells
# per swept wavelength require NZ~5000 already for m=0.005, and scale linearly
# with m.  This NZ=2500 continuous run is a laptop compromise; its late-time
# fine structure must be checked with larger NZ before quantitative use.
MATTER_SLOPE=0.005
MATTER_OFFSET=1.0
# Applies exp[-i*lambda(z)*dt/2] to rho_ex on each half-step (opposite phase
# for rhobar_ex). It keeps the physical spatial phase without RK4 damping.
EXACT_MATTER_ROTATION=true

DAMPING_RATE=0.0
ANTINEUTRINO_COLLISION_RATIO=0.0

ANALYSES=250
SNAPSHOTS=50
T_STEADY=400
# Fifty-one compact snapshots use about 2.43 GiB at this resolution.  This is
# the production choice: it gives useful time resolution in the t-z maps while
# remaining well below typical laptop storage limits.
PLOTS=yes

LINEAR_STABILITY_ANALYSIS=true
LSA_NVZ=200
LSA_NUM=201
LSA_K_MIN=-0.5
LSA_K_MAX=0.5

THREADS=auto
