# Delta-z=0.01 reference for the Soumya slow two-beam m=0.04 case.
# This matches the spatial step documented for the related published fast run.
SCHEME=fd
BOUNDARY=periodic
VACUUM_OSCILLATIONS=true
MATTER_OSCILLATIONS=true
COLLECTIVE_OSCILLATIONS=true
ADVECTION=true
MULTIENERGY=false
Z_MIN=-500
Z_MAX=500
NZ=100000
V_MIN=-1
V_MAX=1
NVZ=2
# dz=0.01 and CFL=1 give dt=0.01, matching the 20k/40k convergence pair.
# The exact matter rotation removes the stiff diagonal phase from explicit RK4;
# CFL=1 remains within the stability interval of fourth-order centered advection.
CFL=1.0
K_MAX=1
K_BINS=2
END_TIME=500
PERTURBATION_SIZE=0.006
MASS_ORDERING=-1
OMEGA=0.006
MIXING_ANGLE=0.00057295779513082321
MU=1
ALPHA=0.85
NEUTRINO_WIDTH=0.6
ANTINEUTRINO_WIDTH=0.6
ANGULAR_PROFILE=soumya_two_beam
RANDOM_SEEDS=false
SEED_WIDTH=5
MATTER_SLOPE=0.04
MATTER_OFFSET=1
EXACT_MATTER_ROTATION=true
DAMPING_RATE=0
ANTINEUTRINO_COLLISION_RATIO=0
ANALYSES=200
SNAPSHOTS=200
T_STEADY=400
PLOTS=no
LINEAR_STABILITY_ANALYSIS=false
THREADS=12
