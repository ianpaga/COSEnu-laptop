# Slow collective oscillations with a linear, spatially inhomogeneous matter potential
#
# Run with:  ./cosenu.sh run conf_templates/inhom_matter_slow.conf
# For a controlled homogeneous reference, copy this file and set
# MATTER_SLOPE=0.0 (leave every grid and physics value unchanged).
#
# This keeps the slow.conf physics and resolution, but enables
#   lambda(z) = MATTER_OFFSET + MATTER_SLOPE * (z - Z_MIN).
# The chosen slope strongly suppresses conversion during this run while still
# leaving measurable coherence growth. It is motivated by the swept-wavenumber mechanism validated in
# Bhattacharyya, Wu & Xiong, arXiv:2504.11316, but this setup has the project's
# continuous angular distributions and nonzero vacuum frequency.
#
# Unit convention (natural units with c=1):
#   - z, t, and SEED_WIDTH are measured in MU^-1
#   - omega, lambda, and damping rates are measured in MU
#   - d lambda/dz is measured in MU^2
#   - MIXING_ANGLE is entered in degrees

SCHEME=fd
BOUNDARY=periodic

VACUUM_OSCILLATIONS=true
MATTER_OSCILLATIONS=true
COLLECTIVE_OSCILLATIONS=true
ADVECTION=true

MULTIENERGY=false
ENERGY_GRID=energy
ENERGY_BINS=12
ENERGY_MIN=2.0
ENERGY_MAX=60.0
OMEGA_GRID_MIN=0.0
OMEGA_GRID_MAX=0.25
REFERENCE_ENERGY=10.0
SPECTRAL_ALPHA=2.3
MEAN_ENERGY_NUE=9.6
MEAN_ENERGY_ANTINUE=11.8
MEAN_ENERGY_NUX=16.0
LUMINOSITY_NUE=44.0
LUMINOSITY_ANTINUE=45.0
LUMINOSITY_NUX=20.0

# The cell size dz=0.4 is the same as slow.conf. The wider box ensures the
# light cone from the central seed does not encounter the periodic boundary
# before END_TIME, as required for a clean linear-gradient experiment.
Z_MIN=-250
Z_MAX=250
NZ=1250
V_MIN=-1.0
V_MAX=1.0
NVZ=256
CFL=0.4

K_MAX=2.0
K_BINS=1000

END_TIME=200
PERTURBATION_SIZE=1e-2
MASS_ORDERING=1.0
OMEGA=1.0e-2
MIXING_ANGLE=0.00057295779513082321
MU=1.0

ALPHA=0.85
NEUTRINO_WIDTH=0.6
ANTINEUTRINO_WIDTH=0.6
ANGULAR_PROFILE=gaussian
RANDOM_SEEDS=false
SEED_WIDTH=5.0

# lambda rises from 0 at z=-250 to 2.5 MU at z=+250.
# In a boundary-safe reduced-resolution comparison at t=196, the homogeneous
# reference reached <|rho_ex|>=0.0571, while this slope gave 0.000343.
# Try 0.003 for a milder delay/suppression or 0.01 for a stronger one.
MATTER_SLOPE=5e-3
MATTER_OFFSET=0.0

DAMPING_RATE=0.0
ANTINEUTRINO_COLLISION_RATIO=0.0

ANALYSES=200
SNAPSHOTS=50
T_STEADY=150
# At NZ=1250 and NVZ=256, 51 compact snapshots use about 1.22 GiB;
# allow roughly 1.3 GiB for the full run.

PLOTS=yes

# The homogeneous LSA supplies Im(Omega(k)); matter_gradient.pdf then follows
# k_eff = k - MATTER_SLOPE*t and integrates the time-dependent growth. A
# constant-rate coherence_comparison.pdf is intentionally skipped here.
LINEAR_STABILITY_ANALYSIS=true
LSA_NVZ=200
LSA_NUM=101
LSA_K_MIN=-0.5
LSA_K_MAX=0.5

THREADS=auto
