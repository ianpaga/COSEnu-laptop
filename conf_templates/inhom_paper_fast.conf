# Fast two-beam validation of the linear matter-gradient benchmark
#
# Run with:  ./cosenu.sh run conf_templates/inhom_paper_fast.conf
# Reference: Bhattacharyya, Wu & Xiong, arXiv:2504.11316.
#
# The paper uses MU=1.5 cm^-1, z in [-90,90] cm, a 2.24 cm Gaussian seed,
# alpha=1/3, and lambda(z)=m(z+90 cm). Values below are the same problem in
# COSEnu units with MU=1. The default m=0.08 cm^-2 is the informative delayed,
# nonlinear case. This is a validation setup; use inhom_matter_slow.conf for the
# project's slow, continuous-angle calculation.

SCHEME=fv
BOUNDARY=periodic
VACUUM_OSCILLATIONS=false
MATTER_OSCILLATIONS=true
COLLECTIVE_OSCILLATIONS=true
ADVECTION=true

MULTIENERGY=false
ENERGY_GRID=energy
ENERGY_BINS=12
ENERGY_MIN=2.0
ENERGY_MAX=60.0
OMEGA_GRID_MIN=0.0
OMEGA_GRID_MAX=0.25
REFERENCE_ENERGY=10.0
SPECTRAL_ALPHA=2.3
MEAN_ENERGY_NUE=9.6
MEAN_ENERGY_ANTINUE=11.8
MEAN_ENERGY_NUX=16.0
LUMINOSITY_NUE=44.0
LUMINOSITY_ANTINUE=45.0
LUMINOSITY_NUX=20.0

# [-90,90] cm * 1.5 cm^-1 = [-135,135] MU^-1.
Z_MIN=-135
Z_MAX=135
NZ=2400
V_MIN=-1.0
V_MAX=1.0
NVZ=2
# Small enough to resolve the fastest Hamiltonian phase even if the larger
# paper slopes listed below are selected.
CFL=0.02

K_MAX=4.5
K_BINS=500

# 2.7 ns * c * 1.5 cm^-1 = 121.416 MU^-1.
END_TIME=121.41594549
PERTURBATION_SIZE=1e-6
MASS_ORDERING=1.0
OMEGA=0.0
MIXING_ANGLE=0.0
MU=1.0

ALPHA=0.3333333333333333
NEUTRINO_WIDTH=0.6       # ignored by the exact two-beam profile
ANTINEUTRINO_WIDTH=0.6   # ignored by the exact two-beam profile
ANGULAR_PROFILE=two_beam # exact neutrino v_z=+1 and antineutrino v_z=-1
RANDOM_SEEDS=false
SEED_WIDTH=3.36           # 2.24 cm * 1.5 cm^-1

# Default: paper m=0.08 cm^-2 / (1.5 cm^-1)^2.
MATTER_SLOPE=0.03555555555555556
MATTER_OFFSET=0.0
# Other paper cases after the same unit conversion:
# MATTER_SLOPE=0.0; MATTER_OFFSET=0.002       # m=0, lambda=0.003 cm^-1
# MATTER_SLOPE=0.004444444444444444           # m=0.01 cm^-2
# MATTER_SLOPE=0.02666666666666667            # m=0.06 cm^-2
# MATTER_SLOPE=0.04                            # m=0.09 cm^-2
# MATTER_SLOPE=0.04444444444444445            # m=0.10 cm^-2
# MATTER_SLOPE=0.13333333333333333            # m=0.30 cm^-2
# MATTER_SLOPE=0.26666666666666666            # m=0.60 cm^-2

DAMPING_RATE=0.0
ANTINEUTRINO_COLLISION_RATIO=0.0

ANALYSES=100
SNAPSHOTS=50
T_STEADY=80
PLOTS=yes
# This validated laptop grid took about 2.4 minutes and 32 MiB on the
# development Mac. Final box-averaged polarization-norm errors were 0.19%
# (neutrinos) and 1.15% (antineutrinos); the paper used NZ=18000.

LINEAR_STABILITY_ANALYSIS=true
LSA_NVZ=2
LSA_NUM=151
LSA_K_MIN=0.0
LSA_K_MAX=3.0

THREADS=auto
