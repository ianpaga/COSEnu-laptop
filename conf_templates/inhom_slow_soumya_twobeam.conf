# Soumya slow-mode benchmark: per-beam-normalized gas with linear matter
#
# Run with:
#   ./cosenu.sh run conf_templates/inhom_slow_soumya_twobeam.conf
#
# Both neutrinos and antineutrinos occupy v_z=-1 and +1.  Following Soumya's
# quoted convention, each beam has g_nue=1 and g_anue=0.85, so
# G(v_z)=rho_ee-rhobar_ee is positive in both beams: there is no ELN crossing
# and therefore no fast instability.  This point is essential; the separate
# ANGULAR_PROFILE=two_beam benchmark puts the two species in opposite beams
# and is intentionally fast-unstable.
#
# Unit convention (natural units with c=1):
#   - z, t, and SEED_WIDTH are in MU^-1
#   - OMEGA, lambda, and damping rates are in MU
#   - MATTER_SLOPE=d lambda/dz is in MU^2
#   - MIXING_ANGLE is entered in degrees

SCHEME=fd
BOUNDARY=periodic

VACUUM_OSCILLATIONS=true
MATTER_OSCILLATIONS=true
COLLECTIVE_OSCILLATIONS=true
ADVECTION=true

MULTIENERGY=false
ENERGY_GRID=energy
ENERGY_BINS=12
ENERGY_MIN=2.0
ENERGY_MAX=60.0
OMEGA_GRID_MIN=0.0
OMEGA_GRID_MAX=0.25
REFERENCE_ENERGY=10.0
SPECTRAL_ALPHA=2.3
MEAN_ENERGY_NUE=9.6
MEAN_ENERGY_ANTINUE=11.8
MEAN_ENERGY_NUX=16.0
LUMINOSITY_NUE=44.0
LUMINOSITY_ANTINUE=45.0
LUMINOSITY_NUX=20.0

# The per-beam Soumya normalization drives finer nonlinear structure than the
# integrated-normalization control.  NZ=5000 left a 10.8% box-averaged
# polarization-length error at t=500 for m=0.005, so the production template
# uses NZ=10000 (dz=0.1).  Use NZ=5000 only for comparative slope scans.
Z_MIN=-500
Z_MAX=500
NZ=10000
V_MIN=-1.0
V_MAX=1.0
NVZ=2
# Soumya reports CFL=0.2.  Keep the same value for the validation template;
# using CFL=0.4 at this NZ is useful only as a faster convergence control.
CFL=0.2

K_MAX=1.0
K_BINS=1000

END_TIME=500
PERTURBATION_SIZE=0.006
MASS_ORDERING=-1.0       # inverted ordering
OMEGA=0.006              # omega/MU
MIXING_ANGLE=0.00057295779513082321  # 1e-5 radians
MU=1.0

ALPHA=0.85                # antineutrino occupation in EACH of the two beams
NEUTRINO_WIDTH=0.6       # unused by the exact Soumya two-beam profile
ANTINEUTRINO_WIDTH=0.6   # unused by the exact Soumya two-beam profile
# Keep this as soumya_two_beam:
#   g_nue(-1)=g_nue(+1)=1 and g_anue(-1)=g_anue(+1)=ALPHA.
# Do NOT use two_beam here; that profile puts nue only at +1 and anue only at
# -1, producing the species-separated fast-flavor benchmark instead.
ANGULAR_PROFILE=soumya_two_beam
RANDOM_SEEDS=false
# The quoted "width ~50" is the Gaussian exponent-denominator scale.
# In the solver convention epsilon=amp*exp[-z^2/(2 sigma^2)], use sigma=5.
# A color-scale fit to the supplied early-time colormap gives sigma~5.5.
SEED_WIDTH=5.0

# lambda(z)=1+m(z+500).  The lambda0=1 offset is printed in the supplied
# legacy figure titles.  It mostly changes the co-rotating flavor phase, but
# retaining it is necessary for a literal comparison.
# The default m=0.005 is one member of Soumya's scan.
# For a controlled scan, change only MATTER_SLOPE; useful values from the
# legacy figure are 0, 1e-3, 5e-3, 1e-2, 2e-2, 4e-2, 8e-2, and 0.15.
# With EXACT_MATTER_ROTATION=true, the stiff diagonal matter phase is applied
# analytically and the CFL choice is controlled primarily by advection and the
# remaining Hamiltonian.  If that option is disabled, use the conservative
# CFL values below, derived for NZ=5000 to keep max_z(lambda)*dt below ~0.4:
#   m <= 0.001 : CFL=0.4       m=0.005: CFL=0.3
#   m = 0.01   : CFL=0.18      m=0.02 : CFL=0.09
#   m = 0.04   : CFL=0.045     m=0.06 : CFL=0.03
#   m = 0.08   : CFL=0.024     m=0.15 : CFL=0.013
# At the production NZ=10000 resolution the same CFL values are twice as
# conservative.  A smaller CFL increases runtime but prevents unresolved
# matter precession from being mistaken for physical enhancement or suppression.
# For example, at m=0.04 and NZ=5000, CFL=0.2 reduced the peak v_z=+1
# antineutrino coherence by a factor of about 25 relative to CFL=0.05.
# Time stepping is not the only constraint: the matter gradient sweeps modes
# to |k_eff|~m*t.  At t=500, roughly 12 cells per swept wavelength require
# NZ >= 5000, 10000, 20000, 40000, 60000, and 80000 for m=0.005, 0.01,
# 0.02, 0.04, 0.06, and 0.08, respectively. Equivalently,
# t_decay~NZ/(m*L) estimates when an unresolved high-k sweep can cause a false
# decrease of coherence; physical strong-matter suppression should hold it
# nearly constant. Nonlinear convergence can demand still finer grids.
MATTER_SLOPE=0.005
MATTER_OFFSET=1.0
# Each half-step applies rho_ex -> exp[-i*lambda(z)*dt/2]*rho_ex and the
# opposite phase to rhobar_ex.  Exact-half/RK4/exact-half stepping preserves
# the physical z-dependent phase while eliminating RK4 amplitude damping.
EXACT_MATTER_ROTATION=true

DAMPING_RATE=0.0
ANTINEUTRINO_COLLISION_RATIO=0.0

ANALYSES=500
SNAPSHOTS=200
T_STEADY=400
# The 202 saved states use about 307 MiB; allow about 0.36 GiB for the complete
# run including the Fourier diagnostic and rasterized PDF plots.
PLOTS=yes

LINEAR_STABILITY_ANALYSIS=true
LSA_NVZ=2
LSA_NUM=201
LSA_K_MIN=-0.5
LSA_K_MAX=0.5

THREADS=auto
