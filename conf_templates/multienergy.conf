# COSEnu laptop multi-energy template: late-accretion benchmark
#
# Run with:  ./cosenu.sh run conf_templates/multienergy.conf
# This uses the spectra and frequency convention of arXiv:2608.26847,
# but a deliberately reduced laptop grid. With the settings below, allow about
# 1.2 GB of available RAM and 600 MB of disk space per run (typical use is
# lower). The plotting environment additionally takes about 150--300 MB once.
# See the README resource guide and the resolution notes below before raising
# the grid sizes to the published validation resolution.

SCHEME=fd
BOUNDARY=periodic

VACUUM_OSCILLATIONS=true
MATTER_OSCILLATIONS=false
COLLECTIVE_OSCILLATIONS=true
ADVECTION=true

# Multi-energy settings. ENERGY_BINS is per sector, so 12 means 24 frequency
# modes. The article used 100 per sector (N_omega=200 total).
MULTIENERGY=true
ENERGY_GRID=omega
ENERGY_BINS=48              # 96 total modes; article validation: 100 per sector
ENERGY_MIN=2.0              # unused on the omega grid
ENERGY_MAX=60.0             # unused on the omega grid
OMEGA_GRID_MIN=0.0
OMEGA_GRID_MAX=0.25
REFERENCE_ENERGY=10.0       # MeV
SPECTRAL_ALPHA=3.0          # chi=3 in the article

# Late-accretion spectrum from Table 1 of arXiv:2608.26847.
MEAN_ENERGY_NUE=9.6         # MeV
MEAN_ENERGY_ANTINUE=11.8    # MeV
MEAN_ENERGY_NUX=16.0        # MeV; also used for antinu_x
LUMINOSITY_NUE=44.0         # common units (10^51 erg/s in the article)
LUMINOSITY_ANTINUE=45.0
LUMINOSITY_NUX=20.0
# Other Table-1 validation spectra (nue / antinue / nux):
#   early accretion: means 8 / 11 / 16 MeV; luminosities 36 / 32 / 28
#   cooling:         means 9 / 10.8 / 11.5 MeV; luminosities 2.1 / 2.0 / 2.5
# Copy this file and replace the six values above to run either case. The
# publication-resolution cooling calculation used NZ=2000 and NVZ=800.

# Published domain and a reduced laptop resolution. The article's accretion
# calculation used NZ=1000, NVZ=600 and CFL=0.9; together with 100 energy bins
# per sector, that needs roughly 15 GiB for the Runge--Kutta states alone.
# Increase gradually and check convergence before treating a run as
# publication resolution. Tests through t=200 show that NZ=1000 keeps the
# spectrum-weighted polarization-norm errors below 0.2%; NZ=500 did not.
Z_MIN=-50
Z_MAX=50
NZ=1000                    # tested laptop grid; article accretion value: 1000
V_MIN=-1.0
V_MAX=1.0
NVZ=64                     # tested laptop grid; article validation: 600
CFL=0.4                    # article validation: 0.9

K_MAX=1.0
K_BINS=401

END_TIME=200
PERTURBATION_SIZE=1e-2
MASS_ORDERING=1.0          # +1 normal ordering; -1 inverted ordering
OMEGA=0.05                 # omega/MU at REFERENCE_ENERGY=10 MeV
MIXING_ANGLE=0.00057295779513082321  # degrees (10^-5 rad effective angle)
MU=1.0

# The article uses the same normalized angular distribution for every mode.
ALPHA=0.85                 # ignored by the multi-energy solver
NEUTRINO_WIDTH=0.6
ANTINEUTRINO_WIDTH=0.6
ANGULAR_PROFILE=gaussian
RANDOM_SEEDS=false
SEED_WIDTH=5.0            # preserves the published multi-energy seed exp[-z^2/(2*5^2)]

MATTER_SLOPE=0.0
MATTER_OFFSET=0.0
DAMPING_RATE=0.0
ANTINEUTRINO_COLLISION_RATIO=0.0

# Spatial snapshots are energy integrated and stored as compact rho_*.npy
# arrays (about 4.9 MiB each at this grid). Each snapshot also writes z-averaged
# energy-angle and fully averaged spectral tables. The checkpoint is about
# 189 MiB; the complete run normally occupies about 350--450 MB.
ANALYSES=200
SNAPSHOTS=25               # 27 files including initial/final: about 132 MiB
T_STEADY=150
PLOTS=yes

LINEAR_STABILITY_ANALYSIS=true
LSA_NVZ=64                # independent LSA angular grid; article used 100
LSA_NUM=81                # independent k grid; article used 199
LSA_K_MIN=-1.0
LSA_K_MAX=1.0

THREADS=auto               # automatically uses up to 12 CPU threads
